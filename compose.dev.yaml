# Local dev PostgreSQL (Path B: clean disposable instance).
# The always-on local PG (Path A) works too — see infra/postgres-init.sql.
#
#   docker compose up -d          # first start runs the init script
#   docker compose down -v        # wipe the data volumes to re-run init
#
# Published on the standard 5432, so stop an always-on local PG (Path A)
# before starting this one.
services:
  postgres:
    image: postgres:18
    container_name: reality-shop-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_DB_PASSWORD:
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro

  traefik:
    image: traefik:v3.3
    container_name: reality-shop-traefik
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true" # dev-only: dashboard has no auth, never do this in prod
    ports:
      - "8000:80"
      - "8081:8080" # dashboard
    volumes:
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:8.10-alpine
    container_name: reality-shop-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data

volumes:
  postgres:
  redis:
